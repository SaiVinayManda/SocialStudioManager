# PROPOSAL ONLY until E-LOCAL-ACCESS-01 is explicitly granted.
services:
  studio-api:
    ports: !reset []
  n8n:
    ports: !reset []
    environment:
      N8N_PROXY_HOPS: '1'
      N8N_PUSH_BACKEND: sse
  loopback-proxy:
    image: docker.n8n.io/n8nio/n8n:2.45.7
    pull_policy: never
    entrypoint: [node, /proxy/server.mjs]
    user: '1000:1000'
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:size=8m]
    volumes:
      - ../services/loopback-proxy:/proxy:ro
    ports: ['127.0.0.1:5678:5678', '127.0.0.1:8780:8780']
    networks: [studio_internal, studio_frontend]
    depends_on:
      n8n: {condition: service_healthy}
      studio-api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "Promise.all([5678,8780].map(p=>fetch('http://127.0.0.1:'+p+'/_proxy_health').then(r=>{if(!r.ok)throw Error()}))).then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
networks:
  studio_frontend:
    name: socialstudio_frontend
    internal: false
